<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>emirates-4st2.onrender.com</title>
  <style>
    * { box-sizing: border-box; }
    html, body {
      margin: 0;
      height: 100%;
      background: #202124;
      color: #9aa0a6;
      font-family: Roboto, "Segoe UI", Arial, sans-serif;
      -webkit-font-smoothing: antialiased;
    }
    body {
      display: flex;
      flex-direction: column;
      min-height: 100vh;
    }
    .content {
      flex: 1;
      display: flex;
      flex-direction: column;
      justify-content: center;
      padding: 0 28px;
      padding-top: env(safe-area-inset-top, 0px);
    }
    .face {
      width: 58px;
      height: 74px;
      border: 4px solid #9aa0a6;
      border-radius: 8px;
      position: relative;
      margin-bottom: 36px;
    }
    .face::before,
    .face::after {
      content: "";
      position: absolute;
      width: 9px;
      height: 9px;
      background: #9aa0a6;
      top: 18px;
    }
    .face::before { left: 10px; }
    .face::after { right: 10px; }
    .face .smile {
      position: absolute;
      left: 14px;
      right: 14px;
      bottom: 14px;
      height: 8px;
      border-bottom: 4px solid #9aa0a6;
      border-radius: 0 0 50% 50%;
    }
    h1 {
      font-size: 24px;
      font-weight: 500;
      color: #9aa0a6;
      margin: 0 0 16px;
      line-height: 1.3;
    }
    p {
      margin: 0 0 18px;
      font-size: 16px;
      line-height: 1.5;
      color: #9aa0a6;
      word-break: break-word;
    }
    .code {
      font-size: 14px;
      color: #9aa0a6;
      letter-spacing: 0.2px;
    }
    .reload {
      margin: 0 24px calc(28px + env(safe-area-inset-bottom, 0px));
      background: #8ab4f8;
      color: #202124;
      border: none;
      border-radius: 28px;
      padding: 16px;
      font-family: inherit;
      font-size: 16px;
      font-weight: 500;
      cursor: pointer;
    }
    .reload:active { opacity: 0.85; }
  </style>
</head>
<body>
  <div class="content">
    <div class="face"><div class="smile"></div></div>
    <h1>This site can't be reached</h1>
    <p>Check if there is a typo in emirates-4st2.onrender.com.</p>
    <div class="code">DNS_PROBE_FINISHED_NXDOMAIN</div>
  </div>

  <button class="reload" onclick="location.reload()">Reload</button>
</body>
</html>
