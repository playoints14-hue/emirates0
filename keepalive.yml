name: Keep site awake

on:
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping site
        run: |
          for url in "https://emirates-4st2.onrender.com/"; do
            code=$(curl -s -o /dev/null -w "%{http_code}" --max-time 60 "$url")
            echo "$url -> $code"
          done
