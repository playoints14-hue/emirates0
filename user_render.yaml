services:
  - type: web
    name: emirates
    runtime: static
    staticPublishPath: .
    headers:
      - path: /*
        name: X-Frame-Options
        value: SAMEORIGIN
      - path: /*
        name: Content-Security-Policy
        value: frame-ancestors 'self'
      - path: /*
        name: X-Content-Type-Options
        value: nosniff
